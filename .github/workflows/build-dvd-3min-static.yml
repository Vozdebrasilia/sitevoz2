name: Build DVD 5-minute people cut

on:
  push:
    branches:
      - video-dvd-3min-final
    paths:
      - '.github/workflows/build-dvd-3min-static.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install static FFmpeg
        run: |
          set -e
          curl -L --fail --retry 3 -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)
          echo "$PWD/$DIR" >> "$GITHUB_PATH"
          "$DIR/ffmpeg" -version

      - name: Download selected source clips
        run: |
          set -e
          curl -L --fail --retry 3 -o p1.mp4 'https://cdn.creativeclaw.co/u/d4de7256/videos/a02911e8-04b5-4ac0-9afb-e1cd0ce8fbcd.mp4'
          curl -L --fail --retry 3 -o p2.mp4 'https://cdn.creativeclaw.co/u/d4de7256/videos/fe88bcc3-d14a-4e5d-b736-6df2c8fa7d22.mp4'
          curl -L --fail --retry 3 -o p3.mp4 'https://cdn.creativeclaw.co/u/d4de7256/videos/b8dc40bf-c90d-4bc6-977c-867ea7e533c1.mp4'
          curl -L --fail --retry 3 -o p4.mp4 'https://cdn.creativeclaw.co/u/d4de7256/videos/f0061d8f-8610-496d-b958-e714d532febd.mp4'

      - name: Render broad party coverage
        run: |
          set -e
          VF="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,eq=contrast=1.04:brightness=0.01:saturation=1.05,hqdn3d=1.2:1.2:6:6,unsharp=5:5:0.30:3:3:0.12,fps=30,format=yuv420p"
          AF="aformat=sample_rates=48000:channel_layouts=stereo,loudnorm=I=-16:LRA=11:TP=-1.5"
          i=1
          for n in 1 2 3; do
            for s in 0 110 220 330 440 550 660 770 880 990; do
              NAME=$(printf "c%03d.mp4" "$i")
              ffmpeg -y -ss "$s" -i "p$n.mp4" -t 7.5 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k "$NAME"
              i=$((i+1))
            done
          done
          for s in 0 60 120 180 240 300 360 420 480 540; do
            NAME=$(printf "c%03d.mp4" "$i")
            ffmpeg -y -ss "$s" -i p4.mp4 -t 7.5 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k "$NAME"
            i=$((i+1))
          done

      - name: Join 40 scenes into 5 minutes
        run: |
          ls c*.mp4 | sort | sed "s#^#file '#; s#$#'#" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy joined.mp4
          ffmpeg -y -i joined.mp4 -t 300 -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k -movflags +faststart DVD_FESTA_5_MINUTOS_TODAS_AS_PESSOAS.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 DVD_FESTA_5_MINUTOS_TODAS_AS_PESSOAS.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: DVD_FESTA_5_MINUTOS_TODAS_AS_PESSOAS
          path: DVD_FESTA_5_MINUTOS_TODAS_AS_PESSOAS.mp4
          retention-days: 7
          compression-level: 0
