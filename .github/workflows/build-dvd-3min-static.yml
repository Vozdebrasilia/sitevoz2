name: Build DVD 3-minute cut STATIC

on:
  push:
    branches:
      - video-dvd-3min-final
    paths:
      - '.github/workflows/build-dvd-3min-static.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install static FFmpeg
        run: |
          set -e
          curl -L --fail --retry 3 -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)
          echo "$PWD/$DIR" >> "$GITHUB_PATH"
          "$DIR/ffmpeg" -version

      - name: Download selected source clips
        run: |
          set -e
          curl -L --fail --retry 3 -o p1.mp4 'https://resource2.heygen.ai/video_repurpose/6638f0669b134a3db9374710920b34e0/highlights/bc5edabf51a1405a8c7d7692464d88bf/1280x720.mp4?response-content-disposition=attachment%3B+filename%2A%3DUTF-8%27%27Livre%2520Estou%253A%2520O%2520Hino%2520da%2520Liberdade.mp4%3B'
          curl -L --fail --retry 3 -o p2.mp4 'https://resource2.heygen.ai/video_repurpose/db717cf8f1454996a3822b82d3ba7f95/highlights/eb4b8db7326945c38c6899316a5fc680/1280x720.mp4?response-content-disposition=attachment%3B+filename%2A%3DUTF-8%27%27A%2520Vit%25C3%25B3ria%2520pela%2520F%25C3%25A9%253A%2520A%2520Queda%2520das%2520Muralhas%2520de%2520Jeric%25C3%25B3.mp4%3B'
          curl -L --fail --retry 3 -o p3.mp4 'https://resource2.heygen.ai/video_repurpose/b9978927b2e543e098c96cd9d495229f/highlights/dafd960ad44749479dd04bda2cf535fc/1280x720.mp4?response-content-disposition=attachment%3B+filename%2A%3DUTF-8%27%27Ora%25C3%25A7%25C3%25A3o%2520de%2520Gratid%25C3%25A3o%2520e%2520B%25C3%25AAn%25C3%25A7%25C3%25A3os%2520para%2520a%2520Fam%25C3%25ADlia.mp4%3B'
          curl -L --fail --retry 3 -o p4.mp4 'https://cdn.creativeclaw.co/u/d4de7256/videos/f0061d8f-8610-496d-b958-e714d532febd.mp4'

      - name: Render speech clips at natural speed
        run: |
          set -e
          VF="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,eq=contrast=1.04:brightness=0.01:saturation=1.05,hqdn3d=1.2:1.2:6:6,unsharp=5:5:0.35:3:3:0.15,fps=30,format=yuv420p"
          AF="aformat=sample_rates=48000:channel_layouts=stereo,loudnorm=I=-16:LRA=11:TP=-1.5"
          ffmpeg -y -i p1.mp4 -t 45 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k s1.mp4
          ffmpeg -y -i p2.mp4 -t 45 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k s2.mp4
          ffmpeg -y -i p3.mp4 -t 49.72 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k s3.mp4
          ffmpeg -y -ss 240 -i p4.mp4 -t 20 -vf "$VF" -af "$AF" -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k s4.mp4

      - name: Render 1.5x visual montage from part 4
        run: |
          set -e
          VF="setpts=PTS/1.5,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,eq=contrast=1.04:brightness=0.01:saturation=1.05,hqdn3d=1.2:1.2:6:6,unsharp=5:5:0.35:3:3:0.15,fps=30,format=yuv420p"
          for spec in "0 v1" "180 v2" "480 v3"; do
            set -- $spec
            START=$1
            NAME=$2
            ffmpeg -y -ss "$START" -i p4.mp4 -t 10 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000               -filter_complex "[0:v]$VF[v]" -map "[v]" -map 1:a -t 6.6667               -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 128k "$NAME.mp4"
          done

      - name: Join and finish at 3 minutes
        run: |
          printf "file 's1.mp4'\nfile 's2.mp4'\nfile 's3.mp4'\nfile 's4.mp4'\nfile 'v1.mp4'\nfile 'v2.mp4'\nfile 'v3.mp4'\n" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy joined.mp4
          ffmpeg -y -i joined.mp4 -vf "tpad=stop_mode=clone:stop_duration=0.28" -af "apad=pad_dur=0.28" -t 180             -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k -movflags +faststart DVD_RESUMO_3_MINUTOS.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 DVD_RESUMO_3_MINUTOS.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: DVD_RESUMO_3_MINUTOS_STATIC
          path: DVD_RESUMO_3_MINUTOS.mp4
          retention-days: 7
          compression-level: 0
